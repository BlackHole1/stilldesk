# StillDesk 的预置弹窗规则
# 放到 ~/.config/stilldesk/preset-blocklist
# ToDesk 运行中会自动重新加载，改完不用重启
#
# 文件完全不存在，表示拦截全部预置弹窗
# 空文件，表示一个都不拦

# 规则
# all                  拦截全部预置弹窗
# allow-all            全部放行，只记日志
# type:N               拦截类型 N 的弹窗
# pair:T/E             只拦截类型 T、错误码 E
#
# 例外规则，优先于任何拦截规则，顺序无关
# allow:type:N
# allow:pair:T/E

all

# 保留这些功能性提示
allow:type:1    # 跨境连接免费服务已到期
allow:type:2    # 上一条的详细说明
allow:type:5    # 跨境流量即将到达上限
allow:type:6    # 上一条的详细说明
allow:type:7
allow:type:8
allow:type:15   # 登录 / 连接错误
allow:type:27   # 多控一插件提示
allow:type:28
allow:type:29

# 其余一律拦截，包括
# 010/012/014/016/017/018  拥堵时建议升级
# 021 到 026               免费时长或次数用完后的升级引导
# 030/032                  「3 天 VIP 免费领取」
# 039/040/041              「老用户专属特惠 / 首月仅 ¥14.9 / 升级会员」
